<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <radialGradient id="brownGradient">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="45" fill="#8B4513" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Shadow/Depth -->
  <circle cx="50" cy="50" r="45" fill="url(#brownGradient)" opacity="0.8"/>
  
  <!-- Inner Highlight -->
  <circle cx="50" cy="48" r="40" fill="none" stroke="#D2691E" stroke-width="2" opacity="0.3"/>
  
  <!-- Bottle Icon -->
  <g transform="translate(50, 52)">
    <!-- Bottle Neck -->
    <rect x="-2.5" y="-24" width="5" height="10" fill="#FFD700" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Bottle Shoulder -->
    <path d="M -2.5 -14 Q -2.5 -12 -6 -10 L -6 12 Q -6 16 -3 16 L 3 16 Q 6 16 6 12 L 6 -10 Q 6 -12 2.5 -14 Z" fill="#FFD700" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Label Lines -->
    <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#654321" stroke-width="1" opacity="0.4"/>
    <line x1="-6" y1="8" x2="6" y2="8" stroke="#654321" stroke-width="1" opacity="0.4"/>
    <!-- Bottle Highlight -->
    <rect x="-1" y="-6" width="1.5" height="18" fill="#FFF" opacity="0.3"/>
  </g>
</svg>