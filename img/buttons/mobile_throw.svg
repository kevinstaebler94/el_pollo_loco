<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <radialGradient id="redGradient">
      <stop offset="0%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="45" fill="#DC143C" stroke="#FF6B6B" stroke-width="4"/>
  
  <!-- Shadow/Depth -->
  <circle cx="50" cy="50" r="45" fill="url(#redGradient)" opacity="0.8"/>
  
  <!-- Inner Highlight -->
  <circle cx="50" cy="48" r="40" fill="none" stroke="#FF4500" stroke-width="2" opacity="0.3"/>
  

</svg>