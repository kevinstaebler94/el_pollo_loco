<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with gradient -->
  <defs>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Button circle -->
  <circle cx="64" cy="64" r="58" fill="url(#playGrad)" stroke="#8B4513" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Inner highlight -->
  <circle cx="64" cy="58" r="52" fill="none" stroke="#FFE55C" stroke-width="2" opacity="0.4"/>
  
  <!-- Play triangle -->
  <path d="M 50 44 L 50 84 L 85 64 Z" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
</svg>