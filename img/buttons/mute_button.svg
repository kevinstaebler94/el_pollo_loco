<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient and shadow definitions -->
  <defs>
    <linearGradient id="muteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowMute">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Button circle -->
  <circle cx="64" cy="64" r="58" fill="url(#muteGrad)" stroke="#8B4513" stroke-width="4" filter="url(#shadowMute)"/>
  
  <!-- Inner highlight -->
  <circle cx="64" cy="58" r="52" fill="none" stroke="#FFE55C" stroke-width="2" opacity="0.4"/>
  
  <!-- Speaker icon -->
  <path d="M 45 52 L 45 76 L 55 76 L 70 88 L 70 40 L 55 52 Z" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
  
  <!-- Mute X line -->
  <line x1="75" y1="54" x2="88" y2="74" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="54" x2="75" y2="74" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
</svg>