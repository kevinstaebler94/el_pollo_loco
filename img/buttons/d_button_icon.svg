<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 44">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE55C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Border as separate shape -->
  <rect x="2" y="2" width="60" height="40" rx="12" fill="#8B4513"/>
  <!-- Inner button -->
  <rect x="4" y="4" width="56" height="36" rx="10" fill="url(#yellowGradient)"/>
  <!-- D Letter -->
  <text x="32" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#8B4513" text-anchor="middle">D</text>
</svg>