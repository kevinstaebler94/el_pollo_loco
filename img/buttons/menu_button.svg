<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient and shadow definitions -->
  <defs>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowMenu">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Button circle -->
  <circle cx="64" cy="64" r="58" fill="url(#menuGrad)" stroke="#8B4513" stroke-width="4" filter="url(#shadowMenu)"/>
  
  <!-- Inner highlight -->
  <circle cx="64" cy="58" r="52" fill="none" stroke="#FFE55C" stroke-width="2" opacity="0.4"/>
  
  <!-- House icon -->
  <!-- Roof -->
  <path d="M 44 64 L 64 46 L 84 64" fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- House body -->
  <rect x="50" y="62" width="28" height="24" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="60" y="72" width="8" height="14" fill="#FFD700" stroke="#6B3410" stroke-width="1"/>
</svg>