<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="img/favicon/favicon.png" type="image/x-icon" />
    <script src="models/drawable-object.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-endboss.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/sound-button.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/games.js"></script>

    <title>El Pollo Loco</title>
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <div class="buttonLayoutWrapper">
      <div class="buttonContainer">
        <span>ARROW LEFT = WALK LEFT</span>
      </div>
      <div class="buttonContainer">
        <span>ARROW RIGHT = WALK RIGHT</span>
      </div>
      <div class="buttonContainer">
        <span>SPACE = JUMP</span>
      </div>
      <div class="buttonContainer">
        <span>D = THROW BOTTLE</span>
      </div>
    </div>

    <div id="startscreen" class="startscreen">
      <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="" />
      <nav class="navbar">
        <img onclick="startGame()" src="img/buttons/play.svg" alt="" />
      </nav>
    </div>

    <div id="endscreen" class="endscreen dNone">
      <img id="lost" class="lost dNone" src="img/You won, you lost/You lost.png" alt="" />
      <img id="won" class="won dNone" src="img/You won, you lost/You win B.png" alt="" />
      <img class="layer2" src="img/5_background/first_half_background.png" alt="" />
      <nav class="navbar">
        <img onclick="startGame()" src="img/buttons/play.svg" alt="" />
        <img onclick="restartGame()" src="img/buttons/fullscreen.svg" alt="" />
      </nav>
    </div>

    <canvas class="dNone" id="canvas" width="720" height="480"></canvas>
  </body>
</html>
