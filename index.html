<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="shortcut icon" href="img/favicon/favicon.png" type="image/x-icon" />
    <script src="models/drawable-object.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/sound-manager.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-endboss.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/sound-button.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/games.js"></script>

    <title>El Pollo Loco</title>
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <div id="startscreen" class="startscreen">
      <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="" />
      <nav class="navbar">
        <img onclick="startGame()" src="img/buttons/play_button.svg" alt="" />
      </nav>
    </div>

    <div id="endscreen" class="endscreen dNone">
      <img id="lost" class="lost dNone" src="img/You won, you lost/You lost.png" alt="" />
      <img id="won" class="won dNone" src="img/You won, you lost/You win B.png" alt="" />
      <img class="layer2" src="img/5_background/first_half_background.png" alt="" />
    </div>

    <div id="tiltScreen" class="tiltScreen dNone">
      <span class="screenInfo">please switch to landscape mode!</span>
    </div>
    
    <canvas class="dNone" id="canvas" width="720" height="480"></canvas>

    <div id="controlsStartscreen" class="buttonLayoutWrapper">
      <div class="buttonContainer">
        <img class="arrowLeft" src="img/buttons/arrow_left_icon.svg" alt="" />
        <span>LEFT</span>
      </div>
      <div class="buttonContainer">
        <img class="arrowRight" src="img/buttons/arrow_right_icon.svg" alt="" />
        <span>RIGHT</span>
      </div>
      <div class="buttonContainer">
        <img class="spaceButton" src="img/buttons/space_icon.svg" alt="" />
        <span>JUMP</span>
      </div>
      <div class="buttonContainer">
        <img class="dButton" src="img/buttons/d_button_icon.svg" alt="" />
        <span>THROW</span>
      </div>
    </div>

    <div class="mobileControls dNone" id="mobileControls">
      <div class="controlsLeft">
        <button class="controlBtn arrowLeft">
          <img src="img/buttons/mobile_left.svg" alt="Left">
        </button>
        <button class="controlBtn arrowRight">
          <img src="img/buttons/mobile_right.svg" alt="Right">
        </button>
      </div>
      
      <div class="controlsRight">
        <button class="controlBtn spaceButton">
          <img src="img/buttons/mobile_jump.svg" alt="Jump">
        </button>
        <button class="controlBtn dButton">
          <img src="img/buttons/mobile_throw.svg" alt="Throw">
        </button>
      </div>
    </div>

    <div id="controlsEndscreen" class="buttonLayoutWrapperEndscreen dNone">
      <div class="buttonContainer">
        <img class="arrowLeft menu" src="img/buttons/menu_button.svg" alt="" />
        <span>MENU</span>
      </div>
      <div class="buttonContainer">
        <img onclick="startGame()" class="arrowRight restart" src="img/buttons/play_button.svg" alt="" />
        <span>RESTART</span>
      </div>
  </body>
</html>
